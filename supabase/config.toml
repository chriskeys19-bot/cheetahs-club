# Function gateway flags for the hosted club project.
# preview-invite and accept-invite authenticate with the invite token.
# The caller does not have an account yet, and a publishable key is not a
# JWT, so the platform JWT check stays off. The handlers reject any request
# that does not present a 32-byte token.

project_id = "cheetahs-club"

[functions.preview-invite]
verify_jwt = false

[functions.accept-invite]
verify_jwt = false

# finish-google-signin runs after the browser exchanges the Google code.
# The gateway requires the new user's JWT. The function then admits an
# invited address, recognizes an already linked member, or deletes a
# Google-only user who has no invite.

[functions.finish-google-signin]
verify_jwt = true

# send-invite-email is only for a signed-in captain or admin.
# The gateway requires a user JWT. The function then checks profiles.role
# and reads the invite under that user's row level security.

[functions.send-invite-email]
verify_jwt = true

# admin-reset-password is only for a signed-in admin.
# The gateway requires a user JWT. The function then reads profiles.role
# for that user. The View-as switcher is not sent and is not trusted.
# After the role check, the service role creates a recovery link.

[functions.admin-reset-password]
verify_jwt = true

# sync-splitwise checks a captain/admin JWT itself, and also accepts the
# x-splitwise-cron secret for pg_cron. That secret is generated in Vault by
# 20261113043000_splitwise_twice_daily_sync.sql. The platform JWT check stays
# off so the cron call is not rejected before the handler runs. The handler
# rejects everyone else. Splitwise secrets never go in the Vite client.

[functions.sync-splitwise]
verify_jwt = false

# sync-feedback-sheet appends feedback rows to the club Google Sheet.
# verify_jwt is off so the insert trigger and the hourly retry can call it
# with the Vault secret. The handler also accepts the service role or an
# admin JWT for a backfill. A sheet failure does not affect the feedback
# insert. The browser does not call this function.

[functions.sync-feedback-sheet]
verify_jwt = false

# splitwise-ensure-member adds the signed-in member to the Cheetahs group.
# The gateway requires a user JWT. The handler calls getUser again, then
# reads profiles.role for the admin backfill. Do not deploy with --no-verify-jwt.

[functions.splitwise-ensure-member]
verify_jwt = true

# request-stream-job queues a check, create, add_scorecard, or end job for a
# signed-in member. The gateway requires a user JWT. The handler calls
# getUser again, then request_stream_job. Ending a stream before the game is
# completed is limited to captains and admins inside that RPC. A completed
# game can still be ended by any signed-in member, which is the automatic end.
# YouTube and CricClubs work stays outside the app. Secrets, never source:
# STREAM_WEBHOOK_URL, STREAM_WEBHOOK_KEY.

[functions.request-stream-job]
verify_jwt = true
